apiVersion: apps/v1
kind: Deployment
metadata:
  name: dipzin-nextjs-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dipzin-nextjs
  template:
    metadata:
      labels:
        app: dipzin-nextjs
    spec:
      containers:
      - name: dipzin-nextjs
        image: dabbonet/dipzin-nextjs:latest
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: dipzin-nextjs-service
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: dipzin-nextjs
