apiVersion: apps/v1
kind: Deployment
metadata:
  name: dipzin-nextjs
  namespace: dipzin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dipzin-nextjs
  template:
    metadata:
      labels:
        app: dipzin-nextjs
    spec:
      containers:
      - name: dipzin-nextjs
        image: ghcr.io/dabbonet/dipzin-nextjs:latest
        ports:
        - containerPort: 3000
      imagePullSecrets:
        - name: registry-1
      serviceAccountName: dipzin-nextjs-service

---
apiVersion: v1
kind: Service
metadata:
  name: dipzin-nextjs-service
  namespace: dipzin
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: dipzin-nextjs
