apiVersion: apps/v1
kind: Deployment
metadata:
  name: dipzin-git-deployment
  namespace: dipzin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dipzin-git-nextjs
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dipzin-git-nextjs
    spec:
      containers:
      - name: dipzin-git-nextjs
        image: ghcr.io/dabbonet/dipzin-nextjs:latest
        ports:
        - containerPort: 3000
          protocol: TCP
      imagePullSecrets:
        - name: registry-1
      serviceAccountName: dipzin-git-nextjs-service
      dnsPolicy: ClusterFirst
      restartPolicy: Always


---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: dipzin-git-nextjs
  name: dipzin-git-service
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 3000
  selector:
    app: dipzin-git-nextjs
  sessionAffinity: None
  type: NodePort